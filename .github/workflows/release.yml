name: Release

# Only tag pushes trigger this. The repo is public, but pull requests from
# forks cannot run this workflow and therefore cannot read the signing secrets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # --generate-notes needs history back to the previous tag

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from gradle.properties
        id: version
        run: |
          read_prop() { grep "^$1=" gradle.properties | cut -d= -f2 | tr -d '[:space:]'; }
          version="$(read_prop VERSION_MAJOR).$(read_prop VERSION_MINOR).$(read_prop VERSION_PATCH)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "gradle.properties declares $version"

      # The only failure that would ship a wrongly-labelled APK, so fail before building.
      - name: Verify tag matches gradle.properties
        run: |
          expected="v${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties ($expected). Bump the version or retag."
            exit 1
          fi

      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew test assembleRelease

      - name: Name the artifact
        id: artifact
        run: |
          name="SMSForwarder-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "${{ steps.artifact.outputs.name }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.artifact.outputs.name }}"

      - name: Scrub signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
